[package]
name = "age-inbox-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
clap = { version = "4.5.60", features = ["derive"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rpassword = "7"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
axum = "0.8.8"
tempfile = "3.27.0"
tokio = "1"
tower-http = "0.6.8"
